  <rect x="140" y="115" width="3" height="45" fill="#94a3b8" rx="1"/>
  <rect x="138" y="113" width="7" height="4" fill="#94a3b8" rx="1"/>
  
  <!-- Recipe book/card -->
  <rect x="60" y="130" width="80" height="50" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <rect x="70" y="140" width="60" height="3" fill="#e2e8f0" rx="1"/>
  <rect x="70" y="148" width="45" height="3" fill="#e2e8f0" rx="1"/>
  <rect x="70" y="156" width="50" height="3" fill="#e2e8f0" rx="1"/>
  <rect x="70" y="164" width="35" height="3" fill="#e2e8f0" rx="1"/>
