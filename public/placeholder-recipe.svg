  <rect width="200" height="200" fill="#f8fafc" rx="12"/>
  
  <!-- Main cooking pot/pan -->
  <ellipse cx="100" cy="85" rx="45" ry="35" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Handle -->
  <path d="M55 75 L45 70 Q40 68 40 75 Q40 82 45 80 L55 75" fill="none" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Steam lines -->
  <path d="M80 50 Q82 45 80 40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M100 45 Q102 40 100 35" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M120 50 Q122 45 120 40" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Food items in pot -->
  <circle cx="90" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="85" r="5" fill="#ef4444"/>
  <circle cx="95" cy="90" r="4" fill="#22c55e"/>
  
  <!-- Utensils -->
  <rect x="130" y="120" width="3" height="40" fill="#94a3b8" rx="1"/>
